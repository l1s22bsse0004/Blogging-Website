name: pr-validation-develop
on:
  pull_request:
      branches:
        - develop

      types:
        - opened
        - synchronize
jobs:
  linting-job:
    name: Linting Job
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Lint HTML Files
        run:  npx htmlhint "**/*.html"
      - name: Lint CSS Files
        run:  npx stylelint "**/*.css" 
  Build-Job:
    name: Build Job
    runs-on: ubuntu-latest
    needs: linting-job
    steps:
     - name: Checkout Repository
       uses: actions/checkout@v4
     - name: Build Project
       run: npx parcel build "./src/index.html" --dist-dir "./dist" --public-url "./"
